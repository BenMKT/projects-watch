services:
  postgres:
    image: postgres:16-alpine
    container_name: cdw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cdw
      POSTGRES_PASSWORD: cdw_dev_password
      POSTGRES_DB: cdw
    ports:
      - "5432:5432"
    volumes:
      - cdw_pg_data:/var/lib/postgresql/data

volumes:
  cdw_pg_data:
